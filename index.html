<title>Jobweek – A Reimbursement Parody</title>
<meta name="description" content="Jobweek: a parody of expense-report software. Drop in receipts and get a form with every little box filled in. A free app from College Towns.">

<style>
:root{--ink:#16202E;--muted:#4A5565;--soft:#5B6575;--line:#DDE2EA;--line2:#EEF1F5;--ground:#F4F5F7;--blue:#1F4FBF;--blueBg:#F0F4FD;--blueInk:#1D3A80;--orange:#C2540A;--warnBg:#FFF1E2;--warnLine:#F5C79B;--warnInk:#6B2E04;--ok:#1E6B45;--okBg:#E5F3EC}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);font-family:'Figtree',system-ui,sans-serif;color:var(--ink);font-size:16px}
a{color:var(--blue)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
header.top{background:var(--ink);color:#fff;padding:0 24px}
.topin{max-width:1280px;margin:0 auto;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;background:none;border:0;color:#fff;cursor:pointer;font-family:inherit;padding:8px 0}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:18px;font-size:14px;flex-wrap:wrap}
.steps li{color:#9AA6B8}.steps li.on{color:#fff;font-weight:600}
main{max-width:1280px;margin:0 auto;padding:32px 24px 72px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:32px;letter-spacing:-.02em}
h2{margin:0;font-size:19px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.row{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.btn{font-family:inherit;font-size:16px;font-weight:600;border-radius:999px;padding:13px 22px;min-height:46px;cursor:pointer;border:1px solid #9AA6B8;background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.small{font-size:14px;padding:9px 14px;min-height:40px}
.btn.link{border-color:var(--blue);color:var(--blue)}
.btn:disabled{background:#E3E7ED;border-color:#E3E7ED;color:var(--soft);cursor:not-allowed}
.drop{border:2px dashed #9AA6B8;border-radius:14px;padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:#FAFBFC;cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blueBg)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;position:relative}
.thumb img{width:100%;height:150px;object-fit:cover;display:block;background:var(--line2)}
.thumb .cap{padding:8px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:1px solid #C9D1DD;background:#fff;cursor:pointer;font-size:16px;line-height:1}
textarea,input[type=text],input[type=number],select{font-family:inherit;font-size:16px;color:var(--ink);border:1px solid #9AA6B8;border-radius:10px;padding:10px 12px;width:100%;background:#fff}
textarea{line-height:1.5;resize:vertical}
.lbl{font-size:13px;font-weight:600;color:var(--soft);display:block;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;min-height:40px;border-radius:999px;border:1px solid #C9D1DD;background:#fff;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.parody{display:flex;gap:12px;align-items:flex-start;background:#FFF8E6;border:1px dashed #C99A2E;border-radius:14px;padding:14px 18px;font-size:15px;line-height:1.5;color:#5A4210}
.pill{flex:none;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#5A4210;color:#FFF8E6;border-radius:999px;padding:4px 10px;margin-top:2px}
.info{background:var(--blueBg);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--blueInk)}
.why{font-size:13px;color:var(--blueInk);margin-top:5px;line-height:1.4}
.warn{background:var(--warnBg);border:1px solid var(--warnLine);border-radius:14px;padding:14px 18px;color:var(--warnInk)}
.err{background:#FDECEC;border:1px solid #F3B8B8;border-radius:14px;padding:14px 18px;color:#7A1F1F}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.lines{display:flex;flex-direction:column;border-right:1px solid var(--line2);background:#FAFBFC;flex:1 1 260px;min-width:0}
.lineBtn{font-family:inherit;text-align:left;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:14px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);min-height:70px}
.lineBtn[aria-current=true]{background:#fff;box-shadow:inset 4px 0 0 var(--blue)}
.tag{font-size:12px;font-weight:700;color:#8A3B05;background:var(--warnBg);padding:3px 8px;border-radius:999px;align-self:flex-start}
.flag{border:1px solid var(--warnLine);background:#FFF8F0;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.flag.done{border-color:#B9DECA;background:#F2FAF5}
.receipt{width:100%;max-height:460px;object-fit:contain;background:var(--line2);border-radius:10px;border:1px solid var(--line)}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
pre.sheet{white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;background:#FAFBFC;border:1px solid var(--line);border-radius:12px;padding:16px;margin:0;max-height:480px;overflow:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;font-weight:600;font-size:15px;min-height:32px}
</style>
</head>

async function imageToJpeg(blob, max=1600){
  const url = URL.createObjectURL(blob);
  try{
    const img = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not open this image'));i.src=url;});
    const sc = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(res,'image/jpeg',0.86));
  } finally { URL.revokeObjectURL(url); }
}
async function pdfToJpegs(file){
  if(!window.pdfjsLib) throw new Error('PDF reader did not load');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const out=[]; const n=Math.min(pdf.numPages,4);
  for(let p=1;p<=n;p++){
    const page=await pdf.getPage(p); const vp0=page.getViewport({scale:1}); const scale=Math.min(2.2,1600/Math.max(vp0.width,vp0.height));
    const vp=page.getViewport({scale}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:g,viewport:vp}).promise;
    out.push({blob: await new Promise(res=>c.toBlob(res,'image/jpeg',0.86)), name: file.name+(n>1?' (page '+p+')':'')});
  }
  return out;
}
async function addFiles(list){
  S.error='';
  if(S.demo){ S.files.forEach(f=>URL.revokeObjectURL(f.url)); S.files=[]; S.demo=false; }
  if(S.sample===null){ S.error='Reading your own receipts only works in the claude.ai version of Jobweek. Try the demo here, or open the live version.'; render(); return; }
  for(const f of list){
    try{
      let parts=[];
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)) parts = await pdfToJpegs(f);
      else if(/^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name)) parts=[{blob: await imageToJpeg(f), name:f.name}];
      else { S.error = f.name+' isn’t a photo or PDF. Upload receipts as JPG, PNG or PDF.'; continue; }
      for(const p of parts) S.files.push({id:++seq, name:p.name, blob:p.blob, url:URL.createObjectURL(p.blob)});
    }catch(e){ S.error = 'Couldn’t open '+f.name+(/heic/i.test(f.name)?' — HEIC photos aren’t supported in the browser; export as JPG first.':'.'); }
  }
  render();
}

  let p = `You are Jobweek. You fill out a university employee's reimbursement request (an "Expense Report") by READING the attached receipt images and the employee's note. The employee will check your work.

Today is ${today()}.

Employee's note: """${S.note.trim() || '(none)'}"""
${hints.length?`Quick hints they tapped: ${hints.join(', ')}\n`:''}
Attached images, in order:
${names}

Rules (from the university's reimbursement instructions):
${budgetRules()}
- Make one expense line per receipt. If an image is a map/route screenshot, make a "Mileage" line: quantity = miles, per_unit = ${Number(S.rate)||0.70}. If the note says they drove there and back and the map shows one way, double it and add a flag.

- Read the real numbers, dates and merchant names from the images. Do not invent anything. If something is unreadable or missing (for example no date), use null and add a flag.

Return ONLY a JSON object, no other text:
{
 "title": "short report name, e.g. 'Field trip — Getty Center'",
 "memo": "one-sentence reason for reimbursement for the report's Memo field",
 "cost_center": "CC-1040 Faculty Programs",

  {"image": 1, "date": "MM/DD/YYYY or null", "merchant": "name on the receipt", "expense_item": "...", "quantity": 1, "per_unit": 0.00, "receipt_total": 0.00, "memo": "short description", "persons": 1, "why": "one sentence: what you read on the receipt and how you got the amount"}
 ],

  if(correction){

function exportDraft(){

}
function parseJSON(text){
  const s=text.indexOf('{'), e=text.lastIndexOf('}');
  if(s<0||e<s) throw new Error('no json');
  return JSON.parse(text.slice(s,e+1));

function normalize(j){

    const isMi = l.expense_item==='Mileage';

    return {image: Math.max(1,Math.min(S.files.length, Number(l.image)||1)), date:l.date||'', merchant:l.merchant||'', expense_item: EXPENSE_ITEMS.includes(l.expense_item)?l.expense_item:'Other Expenses', quantity:q, per_unit:pu, receipt_total: l.receipt_total==null?null:Number(l.receipt_total), memo:l.memo||'', persons: Number(l.persons)||1, why:l.why||''};
  });
  return {employee:(S.draft&&S.draft.employee)||S.employee, department:(S.draft&&S.draft.department)||S.department, title:j.title||'Reimbursement', memo:j.memo||'', company:SCHOOL, report_date:today(), cost_center:j.cost_center||'CC-1040 Faculty Programs', program:j.program||'', fund:'FND-100 General Fund', budget_why:j.budget_why||'', lines, flags:(Array.isArray(j.flags)?j.flags:[]).map((f,i)=>({id:'f'+i+'_'+Date.now(), line:(f.line==null?null:Number(f.line)), title:f.title||'Check this', detail:f.detail||''})), passed:Array.isArray(j.passed)?j.passed:[]};

async function runClaude(correction){
  const sample = S.sample;
  if(!sample){ S.error='Reading receipts needs Claude, which isn’t available in this view. Open this page on claude.ai and allow it when asked.'; render(); return; }
  S.screen='working'; S.busyMsg = correction ? 'Updating your draft…' : 'Reading '+S.files.length+' file'+(S.files.length===1?'':'s')+'…'; S.error=''; render();
  try{
    let lim={}; try{ lim = await sample.limits(); }catch(e){}
    if(lim && lim.images===false){ throw {message:'This view can’t send images to Claude.'}; }
    const res = await sample(buildPrompt(correction), {images: S.files.map(f=>f.blob), modelTier:'default', cache:false});
    const j = parseJSON(res.text||'');
    S.draft = normalize(j); S.sel=0; S.confirmed={}; S.fix='';
    S.screen='review';
  }catch(e){
    S.screen = correction ? 'review' : 'upload';
    S.error = e && e.code==='not_granted' ? 'Jobweek needs your OK to ask Claude to read the receipts. Try again and choose Allow.'
      : e && e.code==='rate_limited' ? 'Too many requests just now — wait a minute and try again.'
      : 'Couldn’t read the receipts that time'+(e&&e.message?' ('+e.message+')':'')+'. Try again, or use clearer photos.';
  }
  render();
}

    font(6.5,'bold'); set(GREY); doc.text(clean(label).toUpperCase(), x+5, y+9);
    font(opts.size||10, opts.bold?'bold':'normal'); set(INK);
    const lines = doc.splitTextToSize(clean(value), w-10);
    const max = Math.max(1, Math.floor((h-14)/((opts.size||10)*1.2)));
    doc.text(lines.slice(0,max), x+5, y+22, {lineHeightFactor:1.2});
  }
  function check(x,y,on,label){
    set(INK,'d'); doc.setLineWidth(0.8); doc.rect(x,y-8,9,9);
    if(on){ doc.setLineWidth(1.4); doc.line(x+1.8,y-3.5,x+3.8,y-1.2); doc.line(x+3.8,y-1.2,x+7.4,y-6.6); }
    font(9); set(INK); doc.text(clean(label), x+15, y);
  }
  function section(y,t){ set(INK,'f'); doc.rect(M,y,CW,16,'F'); font(8.5,'bold'); doc.setTextColor(255,255,255); doc.text(clean(t).toUpperCase(), M+6, y+11); return y+22; }
  function header(cont){
    set(INK,'f'); doc.rect(0,0,W,58,'F');
    font(17,'bold'); doc.setTextColor(255,255,255); doc.text(clean(SCHOOL).toUpperCase(), M, 28);
    font(10.5); doc.text('Employee Expense Reimbursement Request  -  SAMPLE / PARODY'+(cont?' (continued)':''), M, 44);
    font(8); doc.setTextColor(201,209,221); doc.text('Report No.', W-M, 24, {align:'right'});
    font(12,'bold'); doc.setTextColor(255,255,255); doc.text(S.reportNo, W-M, 40, {align:'right'});
    return 74;
  }
  const total = reportTotal();
  let y = header(false);

  // Summary strip
  const q=CW/4;
  box(M,y,q,34,'Report date',d.report_date);
  box(M+q,y,q,34,'Status','Demo - not submitted',{bold:true});
  box(M+2*q,y,q,34,'Currency','Play money (PLY)');
  box(M+3*q,y,q,34,'Total (play money)',money(total)+' PLY',{bold:true,size:12});
  y+=44;

  y=section(y,'1. Employee');
  box(M,y,CW*0.4,34,'Employee name',d.employee||'');
  box(M+CW*0.4,y,CW*0.35,34,'Department',d.department||'');
  box(M+CW*0.75,y,CW*0.25,34,'Expense report for','Employee');
  y+=44;

  y=section(y,'2. Expense report information');
  box(M,y,CW,44,'Memo / reason for reimbursement',d.memo);
  y+=44;
  const t3=CW/3;
  box(M,y,t3,34,'Company',d.company);
  box(M+t3,y,t3,34,'Creation option','Create New Expense Report');
  box(M+2*t3,y,t3,34,'Expense report date',d.report_date);
  y+=34;
  box(M,y,t3,34,'Cost center',d.cost_center);
  box(M+t3,y,t3,34,'Program',d.program||'(left blank - program funds)');
  box(M+2*t3,y,t3,34,'Fund',d.fund);
  y+=34;
  set(LINE,'d'); doc.setLineWidth(0.6); doc.rect(M,y,CW,24);
  font(6.5,'bold'); set(GREY); doc.text('BUDGET', M+5, y+15);
  const grant = !!d.program;
  check(M+60,y+16,!grant,'Program funds (field trip / other)');
  check(M+260,y+16,grant,'Faculty Research Grant');
  check(M+420,y+16,false,'Couch cushions');
  y+=34;

  y=section(y,'3. Expense lines');
  const cols=[['#',20],['Date',58],['Expense item',100],['Merchant / memo',CW-20-58-100-34-58-58-40-38],['Qty',34],['Per unit',58],['Total',58],['Persons',40],['Receipt',38]];
  function tableHead(){
    set(FILL,'f'); doc.rect(M,y,CW,18,'F'); set(LINE,'d'); doc.rect(M,y,CW,18);
    let x=M; font(7,'bold'); set(GREY);
    cols.forEach(([t,w])=>{ doc.text(t.toUpperCase(), x+4, y+12); x+=w; });
    y+=18;
  }
  tableHead();
  d.lines.forEach((l,i)=>{
    const memo = [l.merchant,l.memo].filter(Boolean).join(' - ');
    font(8.5); const ml = doc.splitTextToSize(clean(memo), cols[3][1]-8);
    const il = doc.splitTextToSize(clean(l.expense_item), cols[2][1]-8);
    const h = Math.max(22, 10+Math.max(ml.length,il.length)*10.5);
    if(y+h>700){ doc.addPage(); y=header(true); tableHead(); }
    const isMi=l.expense_item==='Mileage';
    const vals=[String(i+1), l.date||'', il, ml, String(l.quantity), l.per_unit==null?'':Number(l.per_unit).toFixed(isMi?3:2), lineTotal(l)==null?'':lineTotal(l).toFixed(2), String(l.persons||1), null];
    set(LINE,'d'); doc.setLineWidth(0.6); doc.rect(M,y,CW,h);
    let x=M;
    cols.forEach(([t,w],ci)=>{
      if(ci>0){ doc.line(x,y,x,y+h); }
      font(8.5, ci===6?'bold':'normal'); set(INK);
      if(ci===8){ check(x+14,y+14, !!S.files[l.image-1], ''); }
      else { const v=vals[ci]; doc.text(Array.isArray(v)?v:clean(v), (ci>=4&&ci<=6)? x+w-4 : x+4, y+13, {align:(ci>=4&&ci<=6)?'right':'left', lineHeightFactor:1.2}); }
      x+=w;
    });
    y+=h;
  });
  // total row
  if(y+24>720){ doc.addPage(); y=header(true); }
  set(FILL,'f'); doc.rect(M,y,CW,22,'F'); set(LINE,'d'); doc.rect(M,y,CW,22);
  font(9,'bold'); set(INK); doc.text('TOTAL REQUESTED - PAYABLE IN BOARD-GAME CASH ONLY', M+6, y+14);
  font(11,'bold'); doc.text(money(total)+' PLY', W-M-6, y+15, {align:'right'});
  y+=32;

  // policy
  const pol=[
    [d.lines.filter(l=>l.expense_item!=='Mileage').every(l=>Number(l.quantity)===1),'Quantity is 1 on every receipt line'],
    [true,'Alcohol excluded from all claimed amounts'],
    [!d.flags.some(f=>/50/.test(f.title+f.detail)&&!S.confirmed[f.id]),'Meals within the $50 average daily allowance'],
    [d.lines.every(l=>!!S.files[l.image-1]),'Receipt / supporting document attached for every line'],
    [true,'No itemization required']
  ];
  const reviewed = d.flags.filter(f=>S.confirmed[f.id]);
  const polH = 22 + pol.length*15 + (reviewed.length? 14+reviewed.length*12 : 0);
  if(y+polH+125>765){ doc.addPage(); y=header(true); }
  y=section(y,'4. Policy checks');
  pol.forEach(([on,t])=>{ check(M+6,y+9,on,t); y+=15; });
  if(reviewed.length){
    y+=4; font(7,'bold'); set(GREY); doc.text('REVIEWED AND CONFIRMED BY EMPLOYEE', M+6, y+6); y+=14;
    font(8.5); set(INK);
    reviewed.forEach(f=>{ doc.text(doc.splitTextToSize('- '+clean(f.title)+(f.detail?': '+clean(f.detail):''), CW-12)[0], M+6, y+4); y+=12; });
  }
  y+=8;

  y=section(y,'5. Certification and approval');
  font(8.5); set(INK);
  const cert=doc.splitTextToSize('I certify that I did not click through fourteen screens, hunt for a cost-center code, or re-type a single number to produce this form. I understand that Jobweek is a parody and a demo, that this is not a real reimbursement request, and that any reimbursement will be paid in play money, if at all.', CW);
  doc.text(cert, M, y+6, {lineHeightFactor:1.25}); y+= cert.length*11+10;
  const half=CW/2;
  set(LINE,'d'); doc.rect(M,y,half*0.68,40); doc.rect(M+half*0.68,y,half*0.32,40);
  font(6.5,'bold'); set(GREY); doc.text('EMPLOYEE SIGNATURE (DEMO)', M+5, y+9); doc.text('DATE', M+half*0.68+5, y+9);
  font(13,'italic'); set(BLUE); doc.text(clean(d.employee||''), M+8, y+31);
  font(10); set(INK); doc.text(d.report_date, M+half*0.68+5, y+29);
  set(LINE,'d'); doc.rect(M+half,y,half*0.68,40); doc.rect(M+half+half*0.68,y,half*0.32,40);
  font(6.5,'bold'); set(GREY); doc.text('APPROVER SIGNATURE (IMAGINARY)', M+half+5, y+9); doc.text('DATE', M+half+half*0.68+5, y+9);
  y+=50;

  // attachments
  for(let i=0;i<S.files.length;i++){
    const f=S.files[i]; doc.addPage(); let ay=header(true);
    const used = d.lines.map((l,k)=>l.image===i+1?k+1:null).filter(Boolean);
    font(11,'bold'); set(INK); doc.text('Attachment '+(i+1)+' of '+S.files.length, M, ay+4);
    font(9); set(GREY); doc.text(clean(f.name)+(used.length?'   |   Supports line '+used.join(', '):'   |   Not linked to a line'), M, ay+18);
    ay+=30;
    const url = await blobToDataURL(f.blob); const sz = await imgSize(url);
    const maxW=CW, maxH=792-ay-50; const sc=Math.min(maxW/sz.w, maxH/sz.h);
    const iw=sz.w*sc, ih=sz.h*sc;
    set(LINE,'d'); doc.rect(M+(maxW-iw)/2-1, ay-1, iw+2, ih+2);
    doc.addImage(url,'JPEG', M+(maxW-iw)/2, ay, iw, ih);
  }
  // footers
  const n=doc.getNumberOfPages();
  for(let p=1;p<=n;p++){
    doc.setPage(p);
    const hasG = typeof doc.GState==='function' && typeof doc.setGState==='function';
    if(hasG) doc.setGState(new doc.GState({opacity:0.13}));
    font(46,'bold'); doc.setTextColor(200,40,40);
    const wm='SAMPLE - NOT A REAL FORM', tw=doc.getTextWidth(wm), ang=38*Math.PI/180;
    doc.text(wm, W/2-(tw/2)*Math.cos(ang), 396+(tw/2)*Math.sin(ang)-30, {angle:38});
    if(hasG) doc.setGState(new doc.GState({opacity:1}));
    font(7.5); set(GREY); doc.text(S.reportNo+'  |  '+clean(d.title), M, 772); doc.text('Page '+p+' of '+n, W-M, 772, {align:'right'});
    font(7.5,'bold'); doc.setTextColor(170,40,40); doc.text('PARODY DEMO - made with Jobweek, powered by College Towns - not a real reimbursement request', W/2, 784, {align:'center'});
  }
  return doc.output('blob');
}
async function previewPDF(blob){
  const wrap=$('pv'); if(!wrap||!window.pdfjsLib) return;
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data: await blob.arrayBuffer()}).promise;
  wrap.innerHTML='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const vp=page.getViewport({scale:1.6});
    const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    c.setAttribute('role','img'); c.setAttribute('aria-label','Page '+p+' of the reimbursement PDF');
    c.style.cssText='width:100%;max-width:760px;height:auto;display:block;margin:0 auto 18px;background:#fff;box-shadow:0 2px 10px rgba(22,32,46,.18)';
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    wrap.appendChild(c);
  }
}
function vSubmitted(){
  const d=S.draft;
  return `
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
    <div><h1>Your (pretend) reimbursement form</h1>
    <p style="margin:6px 0 0;color:var(--muted);font-size:17px">${esc(d.title)} · <span class="mono">${esc(S.reportNo)}</span> · <span class="mono" style="color:var(--ink)">${money(reportTotal())} in play money</span> · receipts attached · every box filled in</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="backReview" type="button">Back to the draft</button>
      <button class="btn primary" id="dl" type="button" ${S.pdf?'':'disabled'}>Download PDF</button>
    </div>
  </div>
  <span id="dlmsg" style="font-size:14px;color:var(--muted)" aria-live="polite">${esc(S.dlMsg||'')}</span>
  <div id="pv" style="background:#E3E7ED;border-radius:16px;padding:24px 16px">${S.pdf?'':'<p style="text-align:center;color:var(--muted)">Building the PDF…</p>'}</div>
  <div style="display:flex;justify-content:center"><button class="btn" id="again" type="button">Start another</button></div>`;
}
async function makePDF(){
  S.pdf=null; S.dlMsg='';
  try{ S.pdf = await buildPDF(); }
  catch(e){ S.dlMsg='Couldn’t build the PDF ('+(e&&e.message||e)+').'; }
  if(S.screen==='submitted'){ render(); if(S.pdf) previewPDF(S.pdf).catch(()=>{}); }
}
async function downloadPDF(){
  const dl = await (window.claude&&window.claude.use ? window.claude.use('downloads').catch(()=>null) : null);
  const name = (S.reportNo+' '+(S.draft.title||'Reimbursement')).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.pdf';
  if(!dl){
    try{ const u=URL.createObjectURL(S.pdf); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); $('dlmsg').textContent='Downloading '+name+'…'; }
    catch(e){ $('dlmsg').textContent='Your browser blocked the download.'; }
    return;
  }
  try{ await dl.save({filename:name, data:S.pdf}); $('dlmsg').textContent='Saved '+name+'.'; }
  catch(e){ $('dlmsg').textContent = e&&e.code==='declined' ? 'Download cancelled.' : e&&e.code==='rate_limited' ? 'A download prompt is already open — finish that one first.' : 'Couldn’t download ('+(e&&e.code||'error')+').'; }
}

// ---- events
function bind(){
  const on=(id,ev,fn)=>{const el=$(id); if(el) el.addEventListener(ev,fn);};
  on('home','click',()=>{ if(S.screen!=='working'){S.screen='upload';render();} });
  if(S.screen==='upload'){
    on('file','change',e=>{addFiles([...e.target.files]); e.target.value='';});
    const dz=$('drop');
    if(dz){ ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over');}));
      ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over');}));
      dz.addEventListener('drop',e=>addFiles([...e.dataTransfer.files])); }
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const id=+b.dataset.rm; const f=S.files.find(x=>x.id===id); if(f) URL.revokeObjectURL(f.url); S.files=S.files.filter(x=>x.id!==id); S.draft=null; S.demo=false; render();});
    document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{S.hints[b.dataset.hint]=!S.hints[b.dataset.hint]; b.setAttribute('aria-pressed',String(!!S.hints[b.dataset.hint]));});
    on('note','input',e=>S.note=e.target.value);
    on('rate','input',e=>S.rate=e.target.value);
    on('pcode','input',e=>S.programCode=e.target.value);
    on('emp','input',e=>S.employee=e.target.value);
    on('dept','input',e=>S.department=e.target.value);
    on('build','click',()=> (S.demo || !S.sample) ? runDemo() : runClaude());
    on('demo','click',loadDemo);
  }
  if(S.screen==='review'){
    const d=S.draft;
    on('back','click',()=>{S.screen='upload';S.error='';render();});
    document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.sel;render();});
    document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{S.confirmed[b.dataset.ok]=true;render();});
    document.querySelectorAll('[data-h]').forEach(i=>i.addEventListener('input',e=>{d[i.dataset.h]=e.target.value; if(i.dataset.h==='employee')S.employee=e.target.value; if(i.dataset.h==='department')S.department=e.target.value;}));
    document.querySelectorAll('[data-l]').forEach(i=>{
      const k=i.dataset.l; const L=d.lines[S.sel];
      const numeric = ['quantity','per_unit','persons','image'].includes(k);
      i.addEventListener('change',e=>{
        let v=e.target.value;
        if(numeric) v = v===''?null:Number(v);
        L[k]=v;
        if(k==='expense_item'){ if(v!=='Mileage') L.quantity=1; else if(L.per_unit==null) L.per_unit=Number(S.rate)||0.70; }
        render();
      });
      if(!numeric && i.tagName==='INPUT') i.addEventListener('input',e=>{L[k]=e.target.value;});
    });
    on('addLine','click',()=>{d.lines.push({image:1,date:'',merchant:'',expense_item:'Other Expenses',quantity:1,per_unit:null,receipt_total:null,memo:'',persons:1,why:''});S.sel=d.lines.length-1;render();});
    on('delLine','click',()=>{const i=S.sel; d.lines.splice(i,1); d.flags=d.flags.filter(f=>f.line!==i).map(f=>({...f,line:f.line!=null&&f.line>i?f.line-1:f.line})); S.sel=Math.max(0,i-1); render();});
    on('fix','input',e=>S.fix=e.target.value);
    on('doFix','click',()=>{ if(S.fix.trim()) runClaude(S.fix.trim()); });
    on('submit','click',()=>{ if(!S.reportNo) S.reportNo='EX-'+String(Math.floor(1000000+Math.random()*8999999)); S.screen='submitted'; render(); makePDF(); });
  }
  if(S.screen==='submitted'){
    on('dl','click',downloadPDF);
    on('backReview','click',()=>{S.screen='review';render();});
    on('again','click',()=>{S.files.forEach(f=>URL.revokeObjectURL(f.url)); S.files=[];S.note='';S.hints={};S.draft=null;S.confirmed={};S.fix='';S.error='';S.pdf=null;S.reportNo='';S.screen='upload';render();});
  }
}
render();
})();
</script>
